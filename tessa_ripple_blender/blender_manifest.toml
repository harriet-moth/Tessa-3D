schema_version = "1.0.0"

# Identity
id = "tessa_ripple"
version = "0.3.0"
name = "Tessa Ripple"
tagline = "Encode mesh vertices with Tessa and read them back"
maintainer = "Harriet Fisher"
type = "add-on"
tags = ["Mesh", "Animation"]

# Compatibility
blender_version_min = "5.1.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["macos-arm64"]

# Bundled dependencies
wheels = [
  "./wheels/dill-0.4.1-py3-none-any.whl",
  "./wheels/psutil-7.2.2-cp36-abi3-macosx_11_0_arm64.whl",
  "./wheels/python_dateutil-4.0.0-py3-none-any.whl",
  "./wheels/qiskit-2.6.2-cp310-abi3-macosx_11_0_arm64.whl",
  "./wheels/qiskit_aer-0.18.4-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/rustworkx-0.18.1-cp310-abi3-macosx_11_0_arm64.whl",
  "./wheels/scipy-1.18.1-cp313-cp313-macosx_12_0_arm64.whl",
  "./wheels/stevedore-5.10.0-py3-none-any.whl",
  "./wheels/typing_extensions-4.16.0-py3-none-any.whl",
  "./wheels/tzdata-2026.6-py2.py3-none-any.whl",
]

[permissions]
files = "Export OBJ sequences of readouts"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".DS_Store",
  "/.git/",
  "/_to_delete/",
  "/build_ext.py",
  "/*.zip",
]