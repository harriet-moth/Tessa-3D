[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessa-ripple"
version = "0.1.0"
description = "Animate a mesh with the readout noise of Tessa-encoded vertex coordinates."
requires-python = ">=3.11"
dependencies = [
    "tessa-paper @ git+https://github.com/moth-quantum/Tessa@5812e9d04a454d3600cc61d4fb35ef22fa66c6b1",
    "scipy",  # morph: closest points on B (already installed with qiskit)
    "qiskit-ibm-runtime~=0.52.1",  # real IBM chips: the web's "Run & play on IBM", tessa_ripple.hardware
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tessa-ripple = "tessa_ripple.app:main"
tessa-ripple-hw = "tessa_ripple.hardware:main"

[tool.uv]
# fonttools 4.69.0 (a matplotlib dependency) was published with cp311 wheels only, no sdist:
# it cannot install on Vercel's Python 3.12. Drop this once a fixed release is out.
constraint-dependencies = ["fonttools!=4.69.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
